<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Consulta de Orçamentos</title>
</h:head>

<h:body>

    <h1>Consultar Orçamento</h1>

    <h:form>

        Nome do Cliente:

        <h:inputText value="#{consultaBean.nomeCliente}" />

        <h:commandButton value="Buscar"
                         action="#{consultaBean.buscar}" />

        <br/><br/>

        <h:dataTable value="#{consultaBean.orcamentos}"
                     var="orc">

            <h:column>
                <f:facet name="header">ID</f:facet>
                #{orc.id}
            </h:column>

            <h:column>
                <f:facet name="header">Cliente</f:facet>
                #{orc.nomeCliente}
            </h:column>

            <h:column>
                <f:facet name="header">Área</f:facet>
                #{orc.areaCasa}
            </h:column>

            <h:column>
                <f:facet name="header">Valor</f:facet>
                #{orc.valorTotal}
            </h:column>

        </h:dataTable>

    </h:form>

</h:body>
</html>
